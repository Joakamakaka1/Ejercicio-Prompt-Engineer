[project]
name = "pontia-videojuegos-llm"
version = "0.1.0"
description = "Modulo de Prompt Engineering - Ejercicios 1 (AirBnB) y 2 (videojuegos) con LLMs de Groq"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.0",
    "groq>=0.11",
    "python-dotenv>=1.0",
    "matplotlib>=3.7",
    "ipykernel>=6.0",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.6.1",
]
